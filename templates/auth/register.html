{% extends "base.html" %}

{% block title %}Create Account | Campus Connect{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Join Campus Connect</h1>
            <p>Share, collaborate, and engage with peers.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="registerForm">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="e.g. Alex Johnson"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a unique username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Campus Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="student@university.edu"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="department">Department / Major</label>
                <select id="department" name="department">
                    <option value="Computer Science">Computer Science & IT</option>
                    <option value="Engineering">Engineering & Tech</option>
                    <option value="Business & Finance">Business & Economics</option>
                    <option value="Arts & Humanities">Arts & Humanities</option>
                    <option value="Sciences">Natural Sciences & Health</option>
                    <option value="Other">Other Major</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <button type="button" class="toggle-password-btn" id="togglePassword">👁️</button>
                </div>
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>
                Already registered?
                <a href="{{ url_for('auth.login_page') }}">Sign in here</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
